name: sync upstream

# Only master. The feature branch is left alone on purpose: it is what would be
# sent upstream, and a rebase that git calls clean is not the same as code that
# is still correct -- upstream's sidebar_bg change merged without a single
# conflict and still needed a fix by hand.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream into master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add upstream https://github.com/herdrdev/herdr
          git fetch --quiet upstream
          behind=$(git rev-list --count HEAD..upstream/master)
          if [ "$behind" -eq 0 ]; then
            echo "already in sync with $(git rev-parse --short upstream/master)"
            exit 0
          fi
          echo "merging $behind commits up to $(git rev-parse --short upstream/master)"

          git config user.name 'herdr-sync'
          git config user.email 'herdr-sync@users.noreply.github.com'

          # One finding is one issue. Refiling it every run buries the report it
          # exists to deliver, and the run log carries the detail regardless.
          file_issue() {
            open=$(gh issue list --state open --limit 100 --json number,title \
              --jq "map(select(.title == \"$1\")) | .[0].number // empty")
            if [ -n "$open" ]; then
              echo "#$open is open with this title already; not filing another"
              return
            fi
            gh issue create --title "$1" --body-file body.md
          }

          # Conventional subject: CI validates every pushed commit subject, and
          # git's default merge wording is not one.
          if git merge -m 'chore: merge upstream/master' upstream/master; then
            if git push; then
              exit 0
            fi
            # GITHUB_TOKEN is never granted the workflows permission, so any
            # upstream commit touching .github/workflows/ rejects this push and
            # master silently stops moving. Only a token that carries workflow
            # scope fixes it; until then, fail loudly instead of quietly.
            {
              echo 'The merge succeeded but pushing `master` was rejected.'
              echo
              echo 'If the log says `without \`workflows\` permission`, upstream'
              echo 'changed a file under `.github/workflows/` and the built-in'
              echo '`GITHUB_TOKEN` may not push those. Merge by hand:'
              echo
              echo '```'
              echo 'git fetch upstream && git checkout master'
              echo "git merge -m 'chore: merge upstream/master' upstream/master"
              echo 'git push'
              echo '```'
              echo
              echo 'The lasting fix is a token with workflow scope in a secret,'
              echo 'used for the checkout and push in this workflow.'
            } >body.md
            file_issue 'sync: pushing the upstream merge was rejected'
            exit 1
          fi

          # A conflict is a decision, not a chore. Leave master untouched.
          conflicts=$(git diff --diff-filter=U --name-only)
          git merge --abort
          {
            echo "\`master\` is $behind commits behind upstream and the merge conflicts."
            echo
            echo 'Conflicting files:'
            echo '```'
            echo "$conflicts"
            echo '```'
            echo
            echo 'Resolve it by hand:'
            echo '```'
            echo 'git fetch upstream && git checkout master'
            echo 'git merge upstream/master'
            echo '```'
          } >body.md
          file_issue 'sync: merging upstream into master needs hands'
          exit 1
